[package]
name = "llm-proxy-store-redis"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Replica-shared admission, cooldowns and usage for llm-proxy, held in Redis (plan 09, audit conflict 13)."
repository.workspace = true
readme.workspace = true
keywords = ["llm", "proxy", "redis", "rate-limiting", "budgets"]
categories = ["web-programming::http-server"]

[lints]
workspace = true

[features]
default = []
# An in-process Redis server speaking real RESP2 over TCP, for this
# crate's tests and downstream integration tests (the app's replica-arm
# runtime tests) in environments with no Redis binary. Test-only; never
# enable it in production builds.
test-server = []

[dependencies]
llm-proxy-core = { workspace = true }
llm-proxy-engine = { workspace = true }
llm-proxy-storage = { workspace = true, default-features = false }

async-trait = { workspace = true }
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "connection-manager", "streams"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
llm-proxy-core = { workspace = true }
llm-proxy-protocol = { workspace = true }

# `test-server` (the in-process server in src/test_server.rs) is enabled
# for this crate's own replica_state tests by required-features below,
# not by a self dev-dependency: cargo resolves a dev-dependency on the
# crate itself against the registry when packaging, and the crate is not
# there before its first publish, which fails `cargo publish --dry-run`.
# Run them with --features test-server; the quality CI job's
# --all-features run does.
[[test]]
name = "replica_state"
required-features = ["test-server"]
