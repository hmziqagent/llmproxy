[package]
name = "llm-proxy-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Axum router wiring for llm-proxy: routes, middleware, and shared server state."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["tiktoken"]
# Real BPE token counting for the shared token counter (state
# `token_counter`, the /count_tokens route and the engine's input
# estimate), forwarded to llm-proxy-engine's `tiktoken` feature.
tiktoken = ["llm-proxy-engine/tiktoken"]
# Mounts the read-only admin /usage API (requires the SQLite ledger stack).
admin = ["dep:llm-proxy-api", "llm-proxy-storage/sqlite"]
# The semantic response cache (plan 09 step 5): wires
# [server.semantic_cache] into the engine.
semantic-cache = ["dep:llm-proxy-semantic-cache"]
# Non-chat endpoint families (plan 09 step 7): embeddings, rerank, audio,
# images, files and batch routes.
endpoint-families = []

[lints]
workspace = true

[dependencies]
llm-proxy-core = { workspace = true }
llm-proxy-protocol = { workspace = true }
llm-proxy-adapters = { workspace = true }
llm-proxy-transport = { workspace = true }
llm-proxy-storage = { workspace = true }
llm-proxy-engine = { workspace = true }
# The admin /usage surface: optional so the server (and anything embedding it)
# builds without pulling rusqlite through llm-proxy-api -> llm-proxy-storage.
llm-proxy-api = { workspace = true, optional = true }
llm-proxy-semantic-cache = { workspace = true, optional = true }

axum = { workspace = true, features = ["macros", "json"] }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tower = { workspace = true }
tower-http = { version = "0.6", features = ["trace", "timeout", "catch-panic", "set-header", "cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
futures = "0.3"
sha2 = "0.10"
argon2 = { workspace = true }
time = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
argon2 = { workspace = true, features = ["rand_core"] }
tower = { workspace = true, features = ["util"] }
llm-proxy-storage = { workspace = true, features = ["test-utils", "sqlite"] }
tempfile = "3"
tracing-subscriber = { workspace = true }
bytes = "1"
rust_decimal = { workspace = true }
toml = { workspace = true }
