name: CI
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Lint inheritance
        run: |
          # bindings/{node,python} are standalone workspace roots packaged by
          # napi/maturin; they cannot inherit the root workspace's lints.
          for f in $(find . -name Cargo.toml -not -path './target/*' -not -path './ref/*' -not -path './bindings/node/Cargo.toml' -not -path './bindings/python/Cargo.toml' -not -path './Cargo.toml'); do
            grep -q 'workspace = true' "$f" || { echo "Missing [lints] workspace = true in $f"; exit 1; }
          done

      - name: Test
        run: cargo test --workspace --all-features

      # The SDK's documented server-less embedding configuration
      # (`--no-default-features`): its test targets must compile there too.
      - name: SDK without default features
        run: cargo test -p llm-proxy-sdk --no-default-features --locked

      - name: Locked build
        run: cargo build --locked

  # Replaces the rustc `unused_crate_dependencies` lint, which cannot
  # distinguish a genuinely unused dependency from one that a sibling
  # compilation target of that crate uses. cargo-shear analyses the
  # whole workspace and does not have that false-positive mode.
  unused-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
      # Pinned: cargo-shear >= 1.14 pulls ra_ap_* crates that require
      # rustc 1.98, above the 1.96.1 toolchain pinned above. Bump both together.
      - run: cargo install cargo-shear --locked --version 1.13.0
      - run: cargo shear

  # The quality job builds only --all-features, so the feature-off refusal
  # paths and the dependency-closure done-whens (server without rusqlite,
  # core without tiktoken-rs, protocol/adapters network-free, engine without
  # axum, one TLS stack) had no automated evidence. These jobs are it.
  features-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (workspace, default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test (workspace, default features)
        run: cargo test --workspace --locked

      # The default build of the daemon must not compile any optional
      # plan-09 crate. A match fails the step.
      - name: Default build isolation
        run: |
          if cargo tree -p llm-proxy-app --locked -e normal --prefix none | grep -E '^llm-proxy-(store-redis|store-postgres|admin|guardrails|semantic-cache|mcp) '; then
            echo "default build compiles an optional plan-09 crate"
            exit 1
          fi

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [store-redis, store-postgres, admin-ui, semantic-cache, mcp-gateway, endpoint-families]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (${{ matrix.feature }} alone)
        run: cargo clippy -p llm-proxy-app --all-targets --features ${{ matrix.feature }} --locked -- -D warnings

      - name: Test (${{ matrix.feature }} alone)
        run: cargo test -p llm-proxy-app --features ${{ matrix.feature }} --locked

  feature-closures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2

      - name: Server builds without rusqlite
        run: |
          cargo build -p llm-proxy-server --no-default-features --locked
          if cargo tree -p llm-proxy-server --no-default-features -e normal --locked | grep -q rusqlite; then
            echo "llm-proxy-server --no-default-features still depends on rusqlite"
            exit 1
          fi

      - name: Core builds without tiktoken-rs and adapters never see it
        run: |
          cargo build -p llm-proxy-core --no-default-features --locked
          if cargo tree -p llm-proxy-core --no-default-features -e normal --locked | grep -q tiktoken-rs; then
            echo "llm-proxy-core --no-default-features still depends on tiktoken-rs"
            exit 1
          fi
          if cargo tree -p llm-proxy-adapters -e normal --locked | grep -q tiktoken-rs; then
            echo "llm-proxy-adapters depends on tiktoken-rs"
            exit 1
          fi

      # Routing/encoding crates carry no network stack. The control case is
      # llm-proxy-transport, whose tree does match this regex (verified when
      # the job was added), so a regression cannot pass silently.
      - name: Protocol and adapters stay network-free
        run: |
          for p in llm-proxy-protocol llm-proxy-adapters; do
            if cargo tree -p "$p" -e normal --locked --prefix none | grep -Eq '^(reqwest|hyper|tokio|mio|socket2|rustls|axum) '; then
              echo "$p depends on a network crate"
              exit 1
            fi
          done

      - name: Engine has no axum
        run: |
          if cargo tree -p llm-proxy-engine -e normal --locked --prefix none | grep -q '^axum '; then
            echo "llm-proxy-engine depends on axum"
            exit 1
          fi

      # BUG-23: exactly one TLS stack. The lockfile must not name a second
      # one; coarse, but keeps an honest tree from regressing (reqwest 0.13
      # is covered by the app's rustls feature, not here).
      - name: One TLS stack
        run: |
          if grep -Eq '^name = "(native-tls|openssl|openssl-sys)"' Cargo.lock; then
            echo "Cargo.lock contains a second TLS stack"
            exit 1
          fi

  # The plan-03 done-when "`cargo publish --dry-run` passes for every
  # published crate", re-proven on every push instead of self-reported.
  # Every workspace member publishes (all path dependencies carry
  # version = "0.1.0" via [workspace.dependencies]); cargo publishes
  # members in dependency order with an in-order local overlay of the
  # dry-run packages. The bindings/* packages carry publish = false and
  # are standalone workspace roots outside this workspace.
  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2

      - name: Publish dry-run
        run: cargo publish --workspace --dry-run --locked

  # The macOS leg of the plan-10 done-when line (`pip install` and `npm
  # install` work on each platform with no Rust toolchain): builds the
  # universal2 artifacts on a macOS runner, installs the wheel and the
  # packed npm tarball (no Rust involved in either install), and runs both
  # binding contract suites against them. The Linux artifacts are exercised
  # by the same suites locally; Windows via wine (see the package READMEs).
  bindings-macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the universal2 wheel and run the Python suite against the install
        working-directory: bindings/python
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin
          .venv/bin/maturin build --release --target universal2-apple-darwin -o dist
          python -m venv .venv-test
          .venv-test/bin/pip install dist/llm_proxy-*.whl pytest
          .venv-test/bin/python -m pytest tests -q

      - name: Run the Node suite against the darwin-universal binary
        working-directory: bindings/node
        run: |
          npm ci
          # The package's own build script generates binding.js/binding.d.ts
          # and the host arm64 slice; napi build --platform passes the host
          # triple to cargo, so that dylib lands under target/<triple>/release
          # (an explicit --target build skips generating the loader files).
          npm run build
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output llm-proxy.darwin-universal.node \
            target/aarch64-apple-darwin/release/libllm_proxy_node.dylib \
            target/x86_64-apple-darwin/release/libllm_proxy_node.dylib
          node --test test/

      - name: npm install of the packed tarball loads the binary, no Rust toolchain
        working-directory: bindings/node
        run: |
          npm pack
          smoke_dir="${RUNNER_TEMP}/npm-smoke"
          mkdir -p "${smoke_dir}"
          cd "${smoke_dir}"
          npm init -y >/dev/null
          npm install "${GITHUB_WORKSPACE}/bindings/node/freeoxide-llm-proxy-0.1.0.tgz"
          node -e "
            const { Proxy } = require('@freeoxide/llm-proxy');
            const proxy = new Proxy({ providers: [{
              name: 'x', api_key: 'k', auth_style: 'bearer',
              adapters: { a: { protocol: 'anthropic_messages',
                               endpoint: 'http://127.0.0.1:9/v1/messages' } },
              routes: { messages: 'a' },
            }] });
            const out = proxy.translateRequest(
              { model: 'claude-sonnet-4-5', max_tokens: 8,
                messages: [{ role: 'user', content: 'hi' }] },
              'anthropic_messages', 'openai_chat_completions');
            if (!out || out.model !== 'claude-sonnet-4-5') process.exit(1);
          "
